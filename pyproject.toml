[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fundops-intelligence"
version = "0.1.0"
description = "Production-first FundOps Intelligence MVP"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0,<1.0.0",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic-settings>=2.4.0,<3.0.0",
  "httpx>=0.27.0,<1.0.0",
  "google-cloud-bigquery>=3.25.0,<4.0.0",
  "google-cloud-secret-manager>=2.20.0,<3.0.0",
  "google-cloud-logging>=3.11.0,<4.0.0",
  "google-api-python-client>=2.140.0,<3.0.0",
  "google-auth>=2.34.0,<3.0.0",
  "openai>=1.40.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

