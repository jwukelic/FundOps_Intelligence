name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install ".[dev]"
      - run: pytest

  deploy:
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
      id-token: write
    env:
      PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      REGION: ${{ secrets.GCP_REGION }}
      REPOSITORY: fundops-intelligence
      SERVICE_NAME: fundops-intelligence
      JOB_NAME: fundops-intelligence-job
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - id: previous
        run: |
          echo "service_revision=$(gcloud run services describe "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.traffic[0].revisionName)' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
          echo "job_image=$(gcloud run jobs describe "${JOB_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(spec.template.template.spec.containers[0].image)' 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - id: deploy
        run: scripts/deploy.sh
      - id: service_url
        run: echo "url=$(gcloud run services describe "${SERVICE_NAME}" --project "${PROJECT_ID}" --region "${REGION}" --format='value(status.url)')" >> "$GITHUB_OUTPUT"
      - id: manual_token
        run: |
          echo "token=$(gcloud secrets versions access latest --secret fundops-manual-trigger-token --project "${PROJECT_ID}" 2>/dev/null || true)" >> "$GITHUB_OUTPUT"
      - name: Smoke test
        id: smoke
        env:
          SERVICE_URL: ${{ steps.service_url.outputs.url }}
          MANUAL_TRIGGER_TOKEN: ${{ steps.manual_token.outputs.token }}
        run: scripts/smoke_test.sh
      - name: Roll back on smoke failure
        if: failure()
        env:
          PREVIOUS_SERVICE_REVISION: ${{ steps.previous.outputs.service_revision }}
          PREVIOUS_JOB_IMAGE: ${{ steps.previous.outputs.job_image }}
        run: scripts/rollback.sh

